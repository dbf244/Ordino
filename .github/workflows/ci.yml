name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Core tests
        run: swift test --package-path Packages/Core

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test the app
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ordino.xcodeproj \
            -scheme Ordino \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/test.xcresult

      - name: Fail on build warnings
        run: |
          WARNINGS=$(xcrun xcresulttool get build-results --path build/test.xcresult --compact \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["warningCount"])')
          echo "Build warnings: $WARNINGS"
          test "$WARNINGS" -eq 0

      - name: Verify App Sandbox entitlement
        run: |
          codesign -d --entitlements - --xml build/DerivedData/Build/Products/Debug/Ordino.app \
            | python3 -c 'import plistlib, sys; sys.exit(0 if plistlib.loads(sys.stdin.buffer.read()).get("com.apple.security.app-sandbox") is True else 1)'
          echo "App Sandbox is enabled"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test.xcresult
