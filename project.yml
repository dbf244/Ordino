name: Ordino

options:
  bundleIdPrefix: io.github.dbf244
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: "2.40.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Ad-hoc "Sign to Run Locally". A real team is configured for distribution.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  OrdinoCore:
    path: Packages/Core

targets:
  Ordino:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: OrdinoCore
    entitlements:
      path: App/Ordino.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dbf244.Ordino
        PRODUCT_NAME: Ordino
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ordino
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Daniel Boghi. MIT License."
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  OrdinoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    dependencies:
      - target: Ordino
      - package: OrdinoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dbf244.OrdinoTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ordino.app/Contents/MacOS/Ordino"
        BUNDLE_LOADER: "$(TEST_HOST)"

  OrdinoUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: AppUITests
    dependencies:
      - target: Ordino
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dbf244.OrdinoUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Ordino

schemes:
  Ordino:
    build:
      targets:
        Ordino: all
        OrdinoTests: [test]
        OrdinoUITests: [test]
    test:
      targets:
        - OrdinoTests
        - OrdinoUITests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
