<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ordino main window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1100px; height: 720px; box-sizing: border-box; padding: 24px; background: {{ t.canvas }}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif; color: {{ t.text }}">
  <div style="width: 1052px; height: 672px; border-radius: 12px; overflow: hidden; display: flex; background: {{ t.bg }}; border: 1px solid {{ t.border }}; box-shadow: 0 20px 50px rgba(0,0,0,0.18)">
    <nav aria-label="Folders" style="width: 232px; flex-shrink: 0; box-sizing: border-box; padding: 14px 12px 12px; background: {{ t.side }}; border-right: 1px solid {{ t.sep }}; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; gap: 8px; padding: 2px 6px 18px">
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></span>
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></span>
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></span>
      </div>
      <p style="margin: 0; padding: 0 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{ t.muted }}">Folders</p>
      <sc-for list="{{ folders }}" as="f" hint-placeholder-count="4">
        <a href="#" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; text-decoration: none; background: {{ f.bg }}; color: {{ f.fg }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span style="flex-grow: 1; font-size: 14px; font-weight: {{ f.weight }}">{{ f.name }}</span>
          <span style="font-size: 12px; color: {{ t.muted }}">{{ f.count }}</span>
        </a>
      </sc-for>
      <button style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; margin-top: 4px; border: 0; border-radius: 8px; background: transparent; color: {{ t.muted }}; font: 500 14px -apple-system, BlinkMacSystemFont, Inter, sans-serif; text-align: left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add folder
      </button>
      <div style="flex-grow: 1"></div>
      <div style="box-sizing: border-box; padding: 12px; border-radius: 10px; background: {{ t.bg }}; border: 1px solid {{ t.sep }}; display: flex; align-items: center; gap: 10px">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: #28A464"></span>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; font-weight: 600">Watching 4 folders</span>
          <span style="font-size: 12px; color: {{ t.muted }}">14 files tidied today</span>
        </div>
        <button aria-label="Pause all rules" style="width: 28px; height: 28px; border-radius: 6px; border: 1px solid {{ t.border }}; background: transparent; color: {{ t.text }}; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
        </button>
      </div>
    </nav>
    <main style="flex-grow: 1; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 22px; min-width: 0">
      <div style="display: flex; align-items: flex-end; gap: 12px">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em">Downloads</h1>
          <p style="margin: 0; font-size: 13px; color: {{ t.muted }}">~/Downloads · 4 rules · checked in order, first match wins</p>
        </div>
        <button style="height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid {{ t.border }}; background: transparent; color: {{ t.text }}; font: 500 13px -apple-system, BlinkMacSystemFont, Inter, sans-serif; display: flex; align-items: center; gap: 6px">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
          Simulate all
        </button>
        <button style="height: 32px; padding: 0 14px; border-radius: 6px; border: 0; background: {{ t.accent }}; color: {{ t.accentText }}; font: 600 13px -apple-system, BlinkMacSystemFont, Inter, sans-serif; display: flex; align-items: center; gap: 6px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New rule
        </button>
      </div>
      <div style="border-radius: 12px; border: 1px solid {{ t.sep }}; overflow: hidden">
        <sc-for list="{{ rules }}" as="r" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 14px; height: 68px; padding: 0 16px; border-bottom: 1px solid {{ t.sep }}; background: {{ t.bg }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="{{ t.muted }}" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; opacity: {{ r.op }}">
              <span style="font-size: 14px; font-weight: 600">{{ r.name }}</span>
              <span style="font-size: 13px; color: {{ t.muted }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.summary }}</span>
            </div>
            <span style="font-size: 12px; color: {{ t.muted }}; white-space: nowrap">{{ r.meta }}</span>
            <button aria-label="Rule enabled" aria-pressed="{{ r.pressed }}" style="width: 38px; height: 22px; flex-shrink: 0; border-radius: 11px; border: 0; padding: 0; position: relative; background: {{ r.tb }}"><span style="position: absolute; top: 2px; left: {{ r.kl }}; width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25)"></span></button>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline">
          <h2 style="margin: 0; flex-grow: 1; font-size: 17px; font-weight: 600">Recent activity</h2>
          <a href="History.dc.html" style="font-size: 13px; font-weight: 600; color: {{ t.accent }}; text-decoration: none">View history</a>
        </div>
        <sc-for list="{{ activity }}" as="a" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 8px; background: {{ t.row }}">
            <span style="width: 8px; height: 8px; border-radius: 4px; background: {{ t.accent }}"></span>
            <span style="font-size: 13px; font-weight: 600">{{ a.file }}</span>
            <span style="flex-grow: 1; font-size: 13px; color: {{ t.muted }}">{{ a.what }}</span>
            <span style="font-size: 12px; color: {{ t.muted }}">{{ a.when }}</span>
            <button style="height: 26px; padding: 0 10px; border-radius: 6px; border: 0; background: transparent; color: {{ t.accent }}; font: 600 13px -apple-system, BlinkMacSystemFont, Inter, sans-serif">Undo</button>
          </div>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1100,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? false;
const t = dark
? { canvas: '#2B2C2F', bg: '#1E1F21', side: '#252628', text: '#F2F3F4', muted: '#A9ADB2', sep: '#36383B', border: '#45484C', accent: '#4FC2AE', accentText: '#0E2F2A', tint: '#1F3A35', row: '#252628', selText: '#7FD8C7', off: '#4A4D51' }
: { canvas: '#E9ECEB', bg: '#FFFFFF', side: '#F4F5F4', text: '#1C1D1F', muted: '#5F6368', sep: '#E3E5E4', border: '#D5D8D7', accent: '#167A6C', accentText: '#FFFFFF', tint: '#E3F1EE', row: '#F6F7F6', selText: '#0F5E53', off: '#C9CDCC' };
const folders = [
{ name: 'Downloads', count: '4', sel: true },
{ name: 'Desktop', count: '2', sel: false },
{ name: 'Screenshots', count: '1', sel: false },
{ name: 'Documents / Inbox', count: '1', sel: false }
].map(f => ({ ...f, bg: f.sel ? t.tint : 'transparent', fg: f.sel ? t.selText : t.text, weight: f.sel ? 600 : 400 }));
const rules = [
{ name: 'Invoices to Documents', summary: 'PDF files with “invoice” in the name → move to Documents/Invoices/{year}', meta: 'Ran 2 h ago', on: true },
{ name: 'Old installers to Trash', summary: '.dmg and .pkg files added more than 7 days ago → move to Trash', meta: 'Yesterday · 3 files', on: true },
{ name: 'Images by month', summary: 'Images → move to Pictures/Downloads/{year}-{month}', meta: 'Ran 5 min ago', on: true },
{ name: 'Tag large videos', summary: 'Videos larger than 1 GB → add the Red tag', meta: 'Off', on: false }
].map(r => ({ ...r, tb: r.on ? t.accent : t.off, kl: r.on ? '18px' : '2px', pressed: r.on ? 'true' : 'false', op: r.on ? 1 : 0.6 }));
const activity = [
{ file: 'IMG_2041.heic', what: 'Moved to Pictures/Downloads/2026-11', when: '5 min ago' },
{ file: 'invoice-march.pdf', what: 'Moved to Documents/Invoices/2026', when: '2 h ago' },
{ file: 'Zoom-installer.dmg', what: 'Moved to Trash', when: 'Yesterday' }
];
return { t, folders, rules, activity };
}
}
</script>
</body>
</html>
