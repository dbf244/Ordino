<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ordino settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#167A6C}a:hover{color:#0F5E53}
</style>
</helmet>
<div style="width: 760px; height: 540px; box-sizing: border-box; padding: 20px; background: #E9ECEB; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif; color: #1C1D1F">
  <div style="width: 720px; height: 500px; border-radius: 12px; overflow: hidden; background: #FFFFFF; border: 1px solid #D5D8D7; box-shadow: 0 20px 50px rgba(0,0,0,0.18); display: flex; flex-direction: column">
    <div style="flex-shrink: 0; padding: 12px 18px 10px; background: #F4F5F4; border-bottom: 1px solid #E3E5E4; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></span>
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></span>
        <span style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></span>
        <span style="flex-grow: 1; text-align: center; font-size: 13px; font-weight: 600; color: #5F6368">General</span>
        <span style="width: 52px"></span>
      </div>
      <div role="tablist" style="display: flex; justify-content: center; gap: 6px">
        <button role="tab" aria-selected="true" style="width: 96px; height: 48px; border-radius: 8px; border: 0; background: #E3F1EE; color: #0F5E53; font: 600 12px -apple-system, BlinkMacSystemFont, Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M14 5v4M8 15v4"/></svg>General</button>
        <button role="tab" aria-selected="false" style="width: 96px; height: 48px; border-radius: 8px; border: 0; background: transparent; color: #3A3D40; font: 500 12px -apple-system, BlinkMacSystemFont, Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Folder access</button>
        <button role="tab" aria-selected="false" style="width: 96px; height: 48px; border-radius: 8px; border: 0; background: transparent; color: #3A3D40; font: 500 12px -apple-system, BlinkMacSystemFont, Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>History</button>
        <button role="tab" aria-selected="false" style="width: 96px; height: 48px; border-radius: 8px; border: 0; background: transparent; color: #3A3D40; font: 500 12px -apple-system, BlinkMacSystemFont, Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8v.01"/></svg>About</button>
      </div>
    </div>
    <div style="flex-grow: 1; box-sizing: border-box; padding: 20px 56px; display: flex; flex-direction: column">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid #EEF0EF">
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 14px; font-weight: 500">{{ r.title }}</span>
            <span style="font-size: 12px; color: #5F6368">{{ r.desc }}</span>
          </div>
          <button aria-label="{{ r.title }}" aria-pressed="{{ r.pressed }}" style="width: 38px; height: 22px; flex-shrink: 0; border-radius: 11px; border: 0; padding: 0; position: relative; background: {{ r.tb }}"><span style="position: absolute; top: 2px; left: {{ r.kl }}; width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25)"></span></button>
        </div>
      </sc-for>
      <div style="display: flex; align-items: center; gap: 16px; padding: 12px 0">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 14px; font-weight: 500">Language</span>
          <span style="font-size: 12px; color: #5F6368">Follows your Mac unless you choose one</span>
        </div>
        <button style="height: 28px; padding: 0 12px; border-radius: 6px; border: 1px solid #D5D8D7; background: #FFFFFF; font: 500 13px -apple-system, BlinkMacSystemFont, Inter, sans-serif; color: #1C1D1F">System (English) ⌄</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":540}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
{ title: 'Open at login', desc: 'Ordino starts quietly in the menu bar when you log in', on: true },
{ title: 'Notifications', desc: 'Only for rules where you turn notifications on', on: true },
{ title: 'Show in menu bar', desc: 'Turn off to keep Ordino out of sight; rules keep running', on: true },
{ title: 'Advanced mode', desc: 'Regular expressions and nested condition groups', on: false }
].map(r => ({ ...r, tb: r.on ? '#167A6C' : '#C9CDCC', kl: r.on ? '18px' : '2px', pressed: r.on ? 'true' : 'false' }));
return { rows };
}
}
</script>
</body>
</html>
